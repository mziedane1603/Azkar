<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>ورد المساء والصباح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2a1330;
    --sky-mid:#7a2f4c;
    --sky-low:#c85a2e;
    --sun:#f0a33d;
    --sun-light:#ffd28a;
    --parchment:#fbead2;
    --parchment-2:#f6dcb8;
    --ink:#3a2115;
    --ink-soft:#6b4a35;
    --line:#d9a866;
    --ok:#5f8a52;
    --card-shadow: 0 10px 30px rgba(42,19,48,.28);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --sky-top:#3a1c3e;
      --sky-mid:#a3446a;
      --sky-low:#e07a3c;
      --sun:#ffb64d;
      --sun-light:#ffe0a3;
      --parchment:#fff4e1;
      --parchment-2:#fbe6c2;
      --ink:#3a2115;
      --ink-soft:#7a5640;
      --line:#e0b878;
    }
  }
  :root[data-theme="dark"]{
    --sky-top:#180b1e;
    --sky-mid:#5c1f3a;
    --sky-low:#a8471f;
    --sun:#e8942f;
    --sun-light:#ffca7a;
    --parchment:#2b1a16;
    --parchment-2:#33201a;
    --ink:#f3e3cf;
    --ink-soft:#cba883;
    --line:#7a4a2a;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 55% at 50% 100%, var(--sun) 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }

  .sun-disc{
    position:fixed;
    left:50%; bottom:-8vh;
    width:70vw; max-width:420px; aspect-ratio:1/1;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 40%, var(--sun-light) 0%, var(--sun) 55%, transparent 72%);
    filter:blur(2px);
    opacity:.55;
    z-index:0;
    pointer-events:none;
  }

  header{
    position:sticky; top:0; z-index:20;
    padding:18px 18px 10px;
    text-align:center;
    background:linear-gradient(180deg, rgba(24,11,25,.85), rgba(24,11,25,0));
    backdrop-filter:blur(2px);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:800;
    color:var(--sun-light);
    letter-spacing:.5px;
  }
  header p{
    margin:4px 0 0;
    font-size:.8rem;
    color:var(--parchment-2);
    opacity:.85;
  }

  nav{
    position:sticky; top:62px; z-index:19;
    display:flex; gap:8px;
    overflow-x:auto;
    padding:10px 14px 14px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    font-family:'Cairo', sans-serif;
    font-size:.85rem;
    font-weight:600;
    color:var(--parchment);
    background:rgba(251,234,210,.12);
    border:1px solid rgba(251,234,210,.35);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, transform .15s ease;
    white-space:nowrap;
  }
  nav button.active{
    background:var(--sun);
    border-color:var(--sun);
    color:#2a1330;
    transform:translateY(-1px);
  }

  main{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:6px 16px 60px;
  }

  section{ display:none; }
  section.active{ display:block; animation:rise .35s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .intro{
    text-align:center;
    color:var(--parchment);
    font-size:.9rem;
    margin:4px 4px 12px;
    opacity:.9;
    line-height:1.7;
  }

  .section-tools{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }
  .section-tools button{
    font-family:'Cairo', sans-serif;
    font-size:.78rem;
    font-weight:700;
    color:var(--parchment);
    background:rgba(251,234,210,.1);
    border:1px solid rgba(251,234,210,.35);
    border-radius:999px;
    padding:7px 16px;
    cursor:pointer;
  }

  .card{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(200,90,46,.25);
    border-radius:12px;
    pointer-events:none;
  }
  .card .ref{
    font-size:.78rem;
    font-weight:700;
    color:var(--sky-low);
    background:rgba(200,90,46,.12);
    display:inline-block;
    padding:3px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .verse{
    font-family:'Amiri Quran', serif;
    font-size:1.5rem;
    line-height:2.5;
    text-align:center;
    color:var(--ink);
  }

  .dhikr-item{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px 16px;
    margin-bottom:12px;
    box-shadow:0 6px 18px rgba(42,19,48,.16);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:border-color .2s ease, transform .1s ease, opacity .2s ease;
  }
  .dhikr-item:active{ transform:scale(.985); }
  .dhikr-item.done{
    border-color:var(--ok);
  }
  .dhikr-item .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
  }
  .dhikr-item .num{
    font-size:.78rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dhikr-item .note{
    font-size:.78rem;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:6px;
  }
  .dhikr-item .txt{
    font-family:'Amiri Quran', serif;
    font-size:1.18rem;
    line-height:2.15;
    color:var(--ink);
    text-align:right;
  }

  .item-counter{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .item-counter .ring{
    position:relative;
    width:42px; height:42px;
    flex:0 0 auto;
  }
  .item-counter svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .item-counter circle{ fill:none; stroke-width:5; }
  .item-counter .bg{ stroke:rgba(58,33,21,.15); }
  .item-counter .fg{ stroke:var(--sky-low); stroke-linecap:round; transition:stroke-dashoffset .25s ease, stroke .25s ease; }
  .dhikr-item.done .item-counter .fg{ stroke:var(--ok); }
  .item-counter .ring-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.68rem;
    font-weight:800;
    color:var(--ink);
  }
  .item-counter .target-lbl{
    font-size:.72rem;
    font-weight:700;
    color:var(--sky-low);
    white-space:nowrap;
  }
  .dhikr-item.done .item-counter .target-lbl{ color:var(--ok); }
  .tap-hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:.68rem;
    margin-top:6px;
    opacity:.7;
  }

  .counter-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 24px;
  }
  .counter-ring{
    position:relative;
    width:230px; height:230px;
    margin:10px 0 22px;
  }
  .counter-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .counter-ring circle{ fill:none; stroke-width:14; }
  .ring-bg{ stroke:rgba(251,234,210,.25); }
  .ring-fg{ stroke:var(--sun); stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
  .counter-btn{
    position:absolute; inset:0;
    margin:auto;
    width:172px; height:172px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 40% 35%, var(--sun-light), var(--sun) 65%, var(--sky-low));
    color:#2a1330;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 26px rgba(200,90,46,.45), inset 0 -6px 18px rgba(42,19,48,.15);
    transition:transform .12s ease;
    top:29px; left:0; right:0; bottom:0;
  }
  .counter-btn:active{ transform:scale(.94); }
  .counter-btn .num{ font-size:3rem; font-weight:800; line-height:1; }
  .counter-btn .lbl{ font-size:.85rem; font-weight:700; margin-top:6px; opacity:.85; }
  .counter-target{ color:var(--parchment); font-size:.85rem; margin-bottom:14px; opacity:.85; }
  .counter-actions{ display:flex; gap:10px; }
  .counter-actions button{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:.85rem;
    padding:10px 18px;
    border-radius:999px;
    border:1px solid rgba(251,234,210,.4);
    background:rgba(251,234,210,.1);
    color:var(--parchment);
    cursor:pointer;
  }
  .counter-actions button.reset{
    color:#ffd9c2;
    border-color:rgba(255,143,90,.5);
    background:rgba(200,90,46,.18);
  }
  .counter-hint{
    text-align:center;
    color:var(--parchment-2);
    font-size:.78rem;
    margin-top:16px;
    opacity:.75;
    line-height:1.7;
    max-width:320px;
  }

  footer{
    text-align:center;
    color:var(--parchment-2);
    font-size:.75rem;
    opacity:.6;
    padding:20px 20px 10px;
    position:relative; z-index:1;
  }

  @media (max-width:360px){
    .verse{ font-size:1.3rem; }
    .counter-ring{ width:200px; height:200px; }
    .counter-btn{ width:150px; height:150px; }
  }

  @media (prefers-reduced-motion: reduce){
    section.active{ animation:none; }
    .counter-btn{ transition:none; }
  }
</style>
</head>
<body>

<div class="sun-disc"></div>

<header>
  <h1>ورد المساء والصباح</h1>
  <p>آية الكرسي · خواتيم البقرة · المعوذات · أذكار وعداد استغفار</p>
</header>

<nav id="tabs"></nav>

<main id="sections"></main>

<footer>اللهم اجعله علماً ينفعنا وذكراً يقربنا إليك</footer>

<script>
const DATA = {
  kursi: {
    title: "آية الكرسي وخواتيم البقرة",
    intro: "من قرأهما في ليلة لم يزل عليه من الله حافظ، ولم يقربه شيطان حتى يصبح.",
    verses: [
      { ref: "سورة البقرة · ٢٥٥", text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ" },
      { ref: "سورة البقرة · ٢٨٥", text: "آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ" },
      { ref: "سورة البقرة · ٢٨٦", text: "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ" }
    ]
  },
  ikhlas: {
    title: "سورة الإخلاص",
    intro: "تعدل ثلث القرآن.",
    verses: [
      { ref: "١", text: "قُلْ هُوَ اللَّهُ أَحَدٌ" },
      { ref: "٢", text: "اللَّهُ الصَّمَدُ" },
      { ref: "٣", text: "لَمْ يَلِدْ وَلَمْ يُولَدْ" },
      { ref: "٤", text: "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ" }
    ]
  },
  falaq: {
    title: "سورة الفلق",
    intro: "من المعوذتين، تُقرأ للحفظ من كل شر.",
    verses: [
      { ref: "١", text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ" },
      { ref: "٢", text: "مِنْ شَرِّ مَا خَلَقَ" },
      { ref: "٣", text: "وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ" },
      { ref: "٤", text: "وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ" },
      { ref: "٥", text: "وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ" }
    ]
  },
  nas: {
    title: "سورة الناس",
    intro: "من المعوذتين، تُقرأ للحفظ من وسواس الشيطان.",
    verses: [
      { ref: "١", text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ" },
      { ref: "٢", text: "مَلِكِ النَّاسِ" },
      { ref: "٣", text: "إِلَٰهِ النَّاسِ" },
      { ref: "٤", text: "مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ" },

      { ref: "٦", text: "مِنَ الْجِنَّةِ وَالنَّاسِ" }
    ]
  }
};

const MORNING = [
  { target: 1, text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", note: "سيد الاستغفار" },
  { target: 1, text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ" },
  { target: 1, text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ" },
  { target: 1, text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ" },
  { target: 1, text: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا" },
  { target: 1, text: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ" },

const TABS = [
  { id: "kursi", label: "الكرسي وخواتيم البقرة" },
  { id: "ikhlas", label: "الإخلاص" },
  { id: "falaq", label: "الفلق" },
  { id: "nas", label: "الناس" },
  { id: "morning", label: "أذكار الصباح" },
  { id: "evening", label: "أذكار المساء" },
  { id: "istighfar", label: "عداد الاستغفار" }
];

const tabsEl = document.getElementById('tabs');
const sectionsEl = document.getElementById('sections');
const RING_R = 18;
const RING_CIRC = 2 * Math.PI * RING_R;

function verseSectionHTML(key){
  const d = DATA[key];
  let html = `<div class="intro">${d.intro}</div>`;
  d.verses.forEach(v=>{
    html += `<div class="card"><span class="ref">${v.ref}</span><div class="verse">${v.text}</div></div>`;
  });
  return html;
}

function dhikrItemHTML(section, idx, item){
  const id = section + '-' + idx;
  return `<div class="dhikr-item" data-section="${section}" data-idx="${idx}" data-target="${item.target}" id="item-${id}">
    <div class="top-row">
      <span class="num">${idx+1}</span>
      <div class="item-counter">
        <span class="target-lbl" id="lbl-${id}">0 / ${item.target}</span>
        <span class="ring">
          <svg viewBox="0 0 44 44">
            <circle class="bg" cx="22" cy="22" r="${RING_R}"></circle>
            <circle class="fg" id="ring-${id}" cx="22" cy="22" r="${RING_R}"></circle>
          </svg>
          <span class="ring-num" id="num-${id}">0</span>
        </span>
      </div>
    </div>
    ${item.note ? `<div class="note">${item.note}</div>` : ""}
    <div class="txt">${item.text}</div>
  </div>`;
}

function dhikrSectionHTML(section, list, introText){
  let html = `<div class="intro">${introText}</div>
  <div class="section-tools"><button class="section-reset" data-section="${section}">إعادة ضبط عدّاد اليوم</button></div>`;
  list.forEach((item, i)=>{ html += dhikrItemHTML(section, i, item); });
  html += `<div class="tap-hint">اضغط على أي ذكر لعدّ مرة واحدة</div>`;
  return html;
}

const SECTION_HTML = {
  kursi: verseSectionHTML('kursi'),
  ikhlas: verseSectionHTML('ikhlas'),
  falaq: verseSectionHTML('falaq'),
  nas: verseSectionHTML('nas'),
  morning: dhikrSectionHTML('morning', MORNING, "أذكار تُقال من بعد صلاة الفجر إلى شروق الشمس."),
  evening: dhikrSectionHTML('evening', EVENING, "أذكار تُقال من بعد صلاة العصر إلى غروب الشمس."),
  istighfar: `
    <div class="counter-wrap">
      <div class="intro" style="margin-bottom:2px;">فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا</div>
      <div class="counter-target" id="counterTarget">الهدف اليومي: ١٠٠</div>
      <div class="counter-ring">
        <svg viewBox="0 0 230 230">
          <circle class="ring-bg" cx="115" cy="115" r="100"></circle>
          <circle class="ring-fg" id="ringFg" cx="115" cy="115" r="100"></circle>
        </svg>
        <button class="counter-btn" id="counterBtn">
          <span class="num" id="counterNum">0</span>
          <span class="lbl">أستغفر الله</span>
        </button>
      </div>
      <div class="counter-actions">
        <button id="counterReset" class="reset">تصفير</button>
      </div>
      <div class="counter-hint">العدّاد يُحفظ تلقائيًا على هذا الجهاز، ويبدأ من جديد كل يوم.</div>
    </div>
  `
};

TABS.forEach((t, i)=>{
  const btn = document.createElement('button');
  btn.textContent = t.label;
  btn.dataset.id = t.id;
  if(i===0) btn.classList.add('active');
  btn.addEventListener('click', ()=> showSection(t.id));
  tabsEl.appendChild(btn);

  const sec = document.createElement('section');
  sec.id = 'sec-' + t.id;
  sec.innerHTML = SECTION_HTML[t.id];
  if(i===0) sec.classList.add('active');
  sectionsEl.appendChild(sec);
});

function showSection(id){
  document.querySelectorAll('nav button').forEach(b=> b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('main section').forEach(s=> s.classList.toggle('active', s.id === 'sec-' + id));
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  if(id === 'istighfar') initCounterUI();
}

/* ---- shared date stamp ---- */
function dateStamp(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

/* ---- per-item dhikr counters ---- */
function dhikrStorageKey(section, idx){
  return 'dhikr-' + section + '-' + idx + '-' + dateStamp();
}

function loadDhikrCount(section, idx){
  try{
    const v = localStorage.getItem(dhikrStorageKey(section, idx));
    return v ? parseInt(v, 10) : 0;
  }catch(e){ return 0; }
}

function saveDhikrCount(section, idx, val){
  try{ localStorage.setItem(dhikrStorageKey(section, idx), String(val)); }catch(e){}
}

function renderDhikrItem(section, idx, target, count){
  const id = section + '-' + idx;
  const ring = document.getElementById('ring-' + id);
  const numEl = document.getElementById('num-' + id);
  const lblEl = document.getElementById('lbl-' + id);
  const card = document.getElementById('item-' + id);
  if(!ring || !numEl || !lblEl || !card) return;
  if(!ring.dataset.setup){
    ring.style.strokeDasharray = RING_CIRC;
    ring.dataset.setup = "1";
  }
  const progress = Math.min(count / target, 1);
  ring.style.strokeDashoffset = RING_CIRC * (1 - progress);
  numEl.textContent = count;
  lblEl.textContent = count + ' / ' + target;
  card.classList.toggle('done', count >= target);
}

function initDhikrCounters(){
  document.querySelectorAll('.dhikr-item').forEach(card=>{
    const section = card.dataset.section;
    const idx = parseInt(card.dataset.idx, 10);
    const target = parseInt(card.dataset.target, 10);
    const count = loadDhikrCount(section, idx);
    renderDhikrItem(section, idx, target, count);
    if(!card.dataset.bound){
      card.dataset.bound = "1";
      card.addEventListener('click', ()=>{
        let c = loadDhikrCount(section, idx);
        c = (c >= target) ? 0 : c + 1;
        saveDhikrCount(section, idx, c);
        renderDhikrItem(section, idx, target, c);
        if(navigator.vibrate){ navigator.vibrate(10); }
      });
    }
  });
  document.querySelectorAll('.section-reset').forEach(btn=>{
    if(btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener('click', ()=>{
      const section = btn.dataset.section;
      document.querySelectorAll(`.dhikr-item[data-section="${section}"]`).forEach(card=>{
        const idx = parseInt(card.dataset.idx, 10);
        const target = parseInt(card.dataset.target, 10);
        saveDhikrCount(section, idx, 0);
        renderDhikrItem(section, idx, target, 0);
      });
    });
  });
}
initDhikrCounters();

/* ---- Istighfar counter logic ---- */
const TARGET = 100;
const CIRC = 2 * Math.PI * 100;

function todayKey(){ return 'istighfar-' + dateStamp(); }

function loadCount(){
  try{
    const v = localStorage.getItem(todayKey());
    return v ? parseInt(v, 10) : 0;
  }catch(e){ return 0; }
}
function saveCount(n){ try{ localStorage.setItem(todayKey(), String(n)); }catch(e){} }

let count = 0;
let ringReady = false;

function initCounterUI(){
  count = loadCount();
  const ring = document.getElementById('ringFg');
  if(ring && !ringReady){
    ring.style.strokeDasharray = CIRC;
    ringReady = true;
  }
  renderCounter();
  const btn = document.getElementById('counterBtn');
  const resetBtn = document.getElementById('counterReset');
  if(btn && !btn.dataset.bound){
    btn.dataset.bound = "1";
    btn.addEventListener('click', ()=>{
      count += 1;
      saveCount(count);
      renderCounter();
      if(navigator.vibrate){ navigator.vibrate(12); }
    });
  }
  if(resetBtn && !resetBtn.dataset.bound){
    resetBtn.dataset.bound = "1";
    resetBtn.addEventListener('click', ()=>{
      count = 0;
      saveCount(count);
      renderCounter();
    });
  }
}

function renderCounter(){
  const numEl = document.getElementById('counterNum');
  const ring = document.getElementById('ringFg');
  if(!numEl || !ring) return;
  numEl.textContent = count;
  const progress = Math.min(count / TARGET, 1);
  ring.style.strokeDashoffset = CIRC * (1 - progress);
}

initCounterUI();
</script>
